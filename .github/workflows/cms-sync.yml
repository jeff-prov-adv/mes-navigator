# Weekly content sync.
#
# The site's content is pinned to reviewed upstream commits, one per source, in
# data-snapshot/meta.json (see scripts/prepare-data.mjs):
#   sourceCommit      CMS MES Certification Repository
#   mitaSourceCommit  nickarrow/mita-open-blueprint (the MITA framework)
#
# Every Monday this asks each upstream what HEAD is. When either differs from its
# pin, it rebuilds against both resolved commits, runs the full CI suite, and opens
# a PR carrying the new data plus a summary of what changed. Merging advances the
# pins. Nothing here deploys: a human merges, and Vercel builds the merged commit.
name: Content sync

on:
  schedule:
    # Mondays, 12:00 UTC (08:00 ET). Both upstreams move in bursts, days to months
    # apart, so a weekly check sits well inside their cadence.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'CMS ref to sync to (commit, tag, or branch; HEAD = latest). An older commit rehearses the change path.'
        required: false
        default: 'HEAD'
      mita_ref:
        description: 'MITA blueprint ref to sync to (commit, tag, or branch; HEAD = latest).'
        required: false
        default: 'HEAD'

concurrency:
  group: cms-sync
  cancel-in-progress: false

env:
  CMS_REPO: https://github.com/CMSgov/CMCS-DSG-DSS-Certification.git
  MITA_REPO: https://github.com/nickarrow/mita-open-blueprint.git

jobs:
  # Cheap gate: one ls-remote per source. No clone, no npm install, no build when
  # neither upstream has moved, which is the common case.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      cmsTarget: ${{ steps.resolve.outputs.cmsTarget }}
      cmsShort: ${{ steps.resolve.outputs.cmsShort }}
      mitaTarget: ${{ steps.resolve.outputs.mitaTarget }}
      mitaShort: ${{ steps.resolve.outputs.mitaShort }}
      branch: ${{ steps.resolve.outputs.branch }}
      title: ${{ steps.resolve.outputs.title }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream commits
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMS_REF: ${{ inputs.ref || 'HEAD' }}
          MITA_REF: ${{ inputs.mita_ref || 'HEAD' }}
        run: |
          set -euo pipefail
          # A raw commit sha is not advertised by ls-remote, so fall back to it as given.
          resolve() { local sha; sha=$(git ls-remote "$1" "$2" | cut -f1 | head -n1); echo "${sha:-$2}"; }

          cmsPinned=$(node -p "require('./data-snapshot/meta.json').sourceCommit")
          mitaPinned=$(node -p "require('./data-snapshot/meta.json').mitaSourceCommit")
          cmsTarget=$(resolve "$CMS_REPO" "$CMS_REF")
          mitaTarget=$(resolve "$MITA_REPO" "$MITA_REF")

          {
            echo "cmsTarget=$cmsTarget"
            echo "cmsShort=${cmsTarget:0:7}"
            echo "mitaTarget=$mitaTarget"
            echo "mitaShort=${mitaTarget:0:7}"
          } >> "$GITHUB_OUTPUT"

          changes=()
          if [ "$cmsPinned" != "$cmsTarget" ]; then changes+=("CMS ${cmsPinned:0:7} → ${cmsTarget:0:7}"); fi
          if [ "$mitaPinned" != "$mitaTarget" ]; then changes+=("MITA ${mitaPinned:0:7} → ${mitaTarget:0:7}"); fi

          if [ ${#changes[@]} -eq 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Both sources unchanged: CMS at \`${cmsPinned:0:7}\`, MITA at \`${mitaPinned:0:7}\`. Nothing to sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="Content sync: $(printf '%s, ' "${changes[@]}" | sed 's/, $//')"
          # Keyed on both targets, so a re-run (or a second dispatch) cannot stack a
          # duplicate PR, while a later move of either source still gets its own.
          branch="content-sync/cms-${cmsTarget:0:7}-mita-${mitaTarget:0:7}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

          open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "$title, but \`$branch\` already has an open PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "$title. Building and opening a sync PR." >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Match the Node version the Vercel project builds with.
          node-version: '24'
          cache: npm

      - run: npm ci

      # PRs opened with GITHUB_TOKEN do not trigger ci.yml's `pull_request` event,
      # so this job runs CI's checks itself. Keep these steps in step with ci.yml.
      - name: Lint
        run: npx eslint

      - name: Typecheck
        run: npx tsc --noEmit

      # Build against both resolved shas rather than HEAD, so an upstream push
      # mid-run cannot produce data that disagrees with what this PR claims to sync.
      # The unmoved source resolves to its own pin, so it rebuilds identically.
      - name: Build against CMS ${{ needs.check.outputs.cmsShort }} and MITA ${{ needs.check.outputs.mitaShort }}
        env:
          CERT_REPO_REF: ${{ needs.check.outputs.cmsTarget }}
          MITA_REPO_REF: ${{ needs.check.outputs.mitaTarget }}
        run: npm run build

      - name: Data invariants
        run: npm run check:data

      - name: Link check
        run: |
          npx next start -p 3000 &
          echo $! > /tmp/next.pid
          npm run check:links
          kill "$(cat /tmp/next.pid)" 2>/dev/null || true

      # What moved in the content, in review-able terms. The ETL floors tolerate a
      # partial content loss; this is where a shrink becomes visible.
      - name: Content summary
        run: node scripts/summarize-sync.mjs | tee /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.check.outputs.branch }}
          TITLE: ${{ needs.check.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add src/data data-snapshot 'public/SMC Process'
          if git diff --cached --quiet; then
            echo "Build produced no file changes, so no PR was opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "$TITLE"
          git push --set-upstream origin "$BRANCH"

          {
            cat /tmp/summary.md
            echo
            echo '---'
            echo
            echo "Merging advances the content pins in \`data-snapshot/meta.json\`: \`sourceCommit\` to"
            echo "\`${{ needs.check.outputs.cmsTarget }}\` and \`mitaSourceCommit\` to"
            echo "\`${{ needs.check.outputs.mitaTarget }}\`. Vercel then builds this content."
            echo
            echo "Lint, typecheck, build, data invariants, and the link check all passed in the run"
            echo "that opened this PR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "> PRs opened with \`GITHUB_TOKEN\` do not trigger \`ci.yml\`, which is why this"
            echo "> workflow runs those checks itself before opening the PR."
          } > /tmp/body.md

          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/body.md
